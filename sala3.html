<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: "Fredoka", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            background-color: #FDFBF0;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5%;
        }

        #contenedor {
            border: 2px solid #333;
            padding: 5%;
            text-align: center;
            border-radius: 10px;
            width: 60%;
            height: 60%;
            background-color: white;
        }

        img {
            width: 60%;
        }

        #puertas {
            display: flex;
        }

        button {
            padding: 3%;
            border-radius: 40px;
            background-color: #F0A0FF;
            font-family: "Fredoka", sans-serif;
            font-size: larger;
            margin-top: 5%;

        }

        button:hover {
            background-color: #660066;
            color: white
        }
        #contador{
            font-weight: 600;
            color: #660066;
        }
    </style>
</head>

<body>
    <!---Sala 3
Tercera sala: Empleará las siguientes herramientas:
- Creará alguna clase con herencia, propiedades o métodos privados y estáticos.
- Todas las clases se guardarán en módulos y se importarán posteriormente.
-->
    <div id="contenedor">
        <h1>Sala 3</h1>
        <p>
            Bienvenido a la tercera sala. Delante de tí hay 3 puertas, cada una tiene un acertijo diferente.<br><br>
            Para poder pasar a la siguiente sala tendrás que desbloquear las 3 puertas.
        </p>
        <p id="contador"> </p>

        <div id="puertas">
            <div>
                <img id="img1" src="images/puertaAcertijo.png">
                <p id="output-puerta1"></p>
                <button id="puerta1">Puerta 1</button>
            </div>
            <div>
                <img id="img2" src="images/puertaMatematica.png">
                <p id="output-puerta2"></p>
                <button id="puerta2">Puerta 2</button>
            </div>
            <div>
                <img id="img3" src="images/puertaCultural.png">
                <p id="output-puerta3"></p>
                <button id="puerta3">Puerta 3</button>
            </div>
        </div>
        <p id="resultado"> </p>
    </div>



    <script src="sala3.js" type="module"></script>

</body>

</html>
